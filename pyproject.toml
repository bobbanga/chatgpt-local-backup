[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-local-backup"
version = "0.1.0"
description = "Account-independent local vault for ChatGPT exports"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "bobbanga" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chatgpt-archive = "chatgpt_archive.cli:main"

[tool.setuptools.packages.find]
include = ["chatgpt_archive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
